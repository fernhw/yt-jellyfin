# Resolve all *.home queries to this machine (agnos — 192.168.0.8)
address=/.home/192.168.0.8

# Don't forward .home queries upstream — keep them local
local=/home/

# Upstream resolvers
server=1.1.1.1
server=8.8.8.8
no-resolv

# Listen on loopback (for Mac Mini itself via /etc/resolver/home)
# and on LAN interface (for other devices pointing DNS to 192.168.0.8)
listen-address=127.0.0.1,192.168.0.8
bind-interfaces
