# ─────────────────────────────────────────────────────────────────────────────
# nginx-local — LAN routing for agnos.local/<service>
#
# Runs in docker container `nginx-local` (image: nginx:alpine), published on
# host :80. Compose file: docker/nginx/docker-compose.yml.
# Health-checked by serviceCheck.sh (probe: http://127.0.0.1:8081/audiobookshelf/login).
#
# IMPORTANT: This is the LAN counterpart to docker/cloudflared/config.yml.
# Public subdomains (*.fernhw.com) go through cloudflared straight to their
# local port. agnos.local/<prefix> routes go through THIS nginx and proxy_pass
# to the same local ports. Both must stay in sync. Both expect the upstream
# service to be reachable on host.docker.internal:<port>.
#
# Per-service prefix gotchas:
#   /audiobookshelf   ABS hardcodes this prefix at build time. DO NOT remap.
#                     /books exists ONLY as a 301 alias to /audiobookshelf/.
#   /drive            Nextcloud OVERWRITEWEBROOT=/drive in its docker-compose.
#   /tv               Jellyfin runs under /tv via its app config + X-Forwarded-Prefix.
#   /gyra             Flask app uses X-Forwarded-Prefix to build URLs.
# ─────────────────────────────────────────────────────────────────────────────
events {
    worker_connections 1024;
}

http {
    # Shared proxy headers macro
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Force IPv4 resolution for host.docker.internal — Docker Desktop on macOS
    # resolves it to both IPv4 and IPv6, and nginx prefers IPv6 which is not
    # routable inside Docker Desktop's VM, causing "Network unreachable" errors.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Propagate the protocol cloudflared already detected (https for external
    # requests).  Without this, $scheme would always be "http" (cloudflared
    # terminates TLS and hits us over plain HTTP), causing Nextcloud to generate
    # http:// URLs even for drive.fernhw.com visitors.  For plain LAN requests
    # (no incoming X-Forwarded-Proto) we fall back to $scheme (= http).
    map $http_x_forwarded_proto $real_proto {
        default $scheme;
        https   https;
        http    http;
    }

    server {
        listen 80;
        server_name agnos.local _;

        # ── Gyra ── agnos.local/gyra ────────────────────────────────────────
        location /gyra/ {
            proxy_pass         http://host.docker.internal:5050/;
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Prefix  /gyra;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
        location = /gyra { return 301 /gyra/; }

        # ── Jellyfin ── agnos.local/tv  (jellyfin redirects to /tv) ───────────
        location /jellyfin/ { return 301 /tv/; }
        location = /jellyfin { return 301 /tv/; }

        location /tv/ {
            proxy_pass         http://host.docker.internal:8096/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /tv;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 600s;
        }
        location = /tv { return 301 /tv/; }

        # ── Audiobookshelf ── agnos.local/audiobookshelf ───────────────────
        # ABS's built Nuxt client has `/audiobookshelf` hardcoded — do NOT try to
        # remap to a different prefix here; the assets reference absolute
        # /audiobookshelf/_nuxt/... paths. Keep this location matching that prefix.
        # /books is preserved as a 301 alias for muscle-memory bookmarks.
        location /audiobookshelf {
            proxy_pass         http://host.docker.internal:13378;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 600s;
            # Force browsers to evict stale service-worker caches.
            # When ABS was broken and then fixed, browsers (especially Brave)
            # could have registered a SW that cached 404s for _nuxt assets.
            # Clear-Site-Data on the HTML response nukes SW + cache + storage
            # so the fresh assets load correctly. Only applied to HTML responses
            # to avoid wiping assets on every JS/CSS fetch.
            add_header Clear-Site-Data '"cache", "storage"' always;
        }
        location = /audiobookshelf { return 301 /audiobookshelf/; }
        location /books { return 301 /audiobookshelf/; }
        location = /books { return 301 /audiobookshelf/; }

        # ── Drive ── agnos.local/drive (Nextcloud) AND drive.fernhw.com ────────
        # Nextcloud requires BOTH:
        #   1. OVERWRITEWEBROOT=/drive in compose env (and `occ config:system:set
        #      overwritewebroot --value=/drive` on existing installs — env vars
        #      only apply on first-install bootstrap).
        #   2. nginx proxy_pass WITH trailing slash so /drive is STRIPPED before
        #      forwarding to NC's Apache (which serves at /, not /drive).
        # NC then generates URLs (cookies, redirects, asset paths) with /drive
        # prepended via overwritewebroot, and the round-trip works.
        #
        # DO NOT set OVERWRITEHOST or OVERWRITEPROTOCOL in nextcloud compose —
        # nginx passes X-Forwarded-Host=$host and X-Forwarded-Proto=$real_proto
        # so Nextcloud dynamically adapts to both agnos.local (LAN) and
        # drive.fernhw.com (external via cloudflared → this nginx).
        # cloudflared for drive.fernhw.com MUST point here (port 80), NOT 7990.
        location /drive/ {
            proxy_pass              http://host.docker.internal:7990/;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $real_proto;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
            proxy_request_buffering off;
            client_max_body_size    10G;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }
        location = /drive { return 301 /drive/; }

        # ── Office ── agnos.local/office ───────────────────────────────────
        # OnlyOffice Document Server does NOT support being mounted on a sub-path —
        # it always issues absolute redirects to /welcome/, /web-apps/, /sdkjs/, etc.
        # Trying to proxy_pass on /office/ produces 404s when OO redirects to /welcome/.
        # OO is normally accessed via Nextcloud (iframed at /drive/) for actual editing.
        # The standalone welcome page only lives at office.fernhw.com (root-mount via
        # cloudflared tunnel). So the LAN shortcut just redirects there.
        location = /office  { return 302 https://office.fernhw.com/; }
        location /office/   { return 302 https://office.fernhw.com/; }

        # ── Vault ── agnos.local/vault ─────────────────────────────────────
        # Vaultwarden's web UI uses the Web Crypto SubtleCrypto API, which browsers
        # only expose in a *secure context* (HTTPS or localhost). Over plain HTTP
        # on agnos.local the page loads but throws "Could not locate Subtle crypto".
        # nginx-local serves HTTP only, so we redirect the LAN shortcut to the public
        # HTTPS hostname (cloudflared tunnel → 127.0.0.1:7992).
        location = /vault  { return 302 https://vault.fernhw.com/; }
        location /vault/   { return 302 https://vault.fernhw.com/; }

        # ── Report ── agnos.local/report ───────────────────────────────────
        location /report/ {
            proxy_pass         http://host.docker.internal:8765/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /report { return 301 /report/; }

        # ── Request ── agnos.local/request ─────────────────────────────────
        location /request/ {
            proxy_pass         http://host.docker.internal:8770/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /request { return 301 /request/; }

        # ── Status ── agnos.local/status ─────────────────────────────────
        # Static files via Python http.server on port 8765.
        # /status/metrics is proxied to metricsd.py (port 8766).
        location = /status/metrics {
            proxy_pass         http://host.docker.internal:8766/metrics;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 8s;
        }
        location /status/ {
            proxy_pass         http://host.docker.internal:8765/status/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /status { return 301 /status/; }

        # ── Photos ── agnos.local/photos ───────────────────────────────────
        location /photos/ {
            proxy_pass         http://host.docker.internal:2283/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
        location = /photos { return 301 /photos/; }
    }

    # ─── drive.fernhw.com (external via cloudflared → nginx :8081) ──────────────
    # Dedicated block so the root-redirect to /drive/ only fires for this hostname,
    # not for jellyfin.fernhw.com or any other external domain.
    server {
        listen 80;
        server_name drive.fernhw.com;

        location = / { return 302 $real_proto://drive.fernhw.com/drive/; }
        location = /drive { return 301 /drive/; }

        # ── Mobile-app discovery (Nextcloud / OnlyOffice iOS + Android) ────────
        # Because Nextcloud is mounted under /drive (OVERWRITEWEBROOT=/drive),
        # client apps that probe these endpoints at the ROOT get 404 and reject
        # the server as "not Nextcloud". These are the redirects from the
        # Nextcloud Admin Manual's sub-path-install section, ported to nginx.
        # They MUST live here (under server_name drive.fernhw.com) so they only
        # fire for the public hostname, not for the agnos.local catch-all.
        #
        # CRITICAL: /status.php is PROXIED (not redirected) because the iOS
        # Nextcloud app and OnlyOffice app validate the server with a single
        # GET /status.php and do NOT follow 3xx responses. Returning the JSON
        # directly is the only thing that makes those apps accept the URL.
        # Inside the NC container Apache serves status.php at /, so we proxy
        # straight to host.docker.internal:7990/status.php.
        #
        # The well-known endpoints DO use 301 (per Nextcloud docs) and Location
        # MUST be https:// — we use $real_proto (mapped from X-Forwarded-Proto
        # injected by cloudflared) instead of nginx's $scheme, which is always
        # http here because cloudflared terminates TLS upstream.
        # $is_args$args preserves any query string (webfinger uses ?resource=).
        location = /status.php {
            proxy_pass              http://host.docker.internal:7990;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $real_proto;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
        }
        location = /.well-known/webfinger { return 301 $real_proto://$host/drive/index.php/.well-known/webfinger$is_args$args; }
        location = /.well-known/nodeinfo  { return 301 $real_proto://$host/drive/index.php/.well-known/nodeinfo$is_args$args; }
        location = /.well-known/caldav    { return 301 $real_proto://$host/drive/remote.php/dav/; }
        location = /.well-known/carddav   { return 301 $real_proto://$host/drive/remote.php/dav/; }
        location = /.well-known/host-meta      { return 301 $real_proto://$host/drive/public.php?service=host-meta; }
        location = /.well-known/host-meta.json { return 301 $real_proto://$host/drive/public.php?service=host-meta-json; }

        # ── Nextcloud API endpoints proxied at the ROOT ────────────────────────
        # The iOS Nextcloud app, OnlyOffice app, and desktop sync client all
        # call these paths at the host root after status.php succeeds. They do
        # NOT follow redirects to a sub-path. We proxy them straight to the
        # equivalent /drive/* path on the backend. Browser users are unaffected
        # because they enter via `/` → 302 → `/drive/` and never hit these
        # locations directly. Order matters: `location ^~` would beat exact `=`
        # matches above, so we use plain prefix matches — the `= /.well-known/*`
        # locations above still win for those exact URIs.
        # proxy_pass with a URI rewrites the request — trailing slash on both
        # sides preserves the path tail.
        # NOTE: proxy_pass has NO URI path → nginx forwards the original URI
        # unchanged. The NC container's Apache is mounted at ROOT (/), not
        # /drive — the /drive prefix only exists at this nginx layer (stripped
        # by `location /drive/`). OVERWRITEWEBROOT=/drive only affects URLs NC
        # generates in its responses. So root-level /index.php, /ocs, etc.
        # forwarded as-is to the backend hit the correct PHP handlers.
        location /index.php {
            proxy_pass              http://host.docker.internal:7990;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $real_proto;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
            proxy_request_buffering off;
            client_max_body_size    10G;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }
        location /ocs/ {
            proxy_pass              http://host.docker.internal:7990;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $real_proto;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
        }
        location /remote.php {
            proxy_pass              http://host.docker.internal:7990;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $real_proto;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
            proxy_request_buffering off;
            client_max_body_size    10G;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }
        location /public.php {
            proxy_pass              http://host.docker.internal:7990;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $real_proto;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
        }
        location /login/ {
            proxy_pass              http://host.docker.internal:7990;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $real_proto;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
        }

        location /drive/ {
            proxy_pass              http://host.docker.internal:7990/;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $real_proto;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
            proxy_request_buffering off;
            client_max_body_size    10G;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }
    }

    # ─── jellyfin.fernhw.com (external via cloudflared → nginx :8081) ───────────
    # Jellyfin serves at root /  (no base-path configured in Jellyfin admin).
    # Proxy everything straight to port 8096 — no path stripping.
    # Jellyfin apps should be configured with https://jellyfin.fernhw.com (no /tv suffix).
    server {
        listen 80;
        server_name jellyfin.fernhw.com;

        location / {
            proxy_pass         http://host.docker.internal:8096;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 600s;
        }
    }

    # status.fernhw.com — monitoring dashboard
    # Served from web/status/ via the Python http.server on port 8765.
    # /metrics is proxied to metricsd (port 8766) for the real-time sys dashboard.
    server {
        listen 80;
        server_name status.fernhw.com;

        # Real-time system metrics JSON — served by metricsd.py on port 8766.
        location = /metrics {
            proxy_pass         http://host.docker.internal:8766/metrics;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
            proxy_read_timeout 8s;
        }

        location / {
            proxy_pass         http://host.docker.internal:8765/status/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $real_proto;
        }
    }
}
