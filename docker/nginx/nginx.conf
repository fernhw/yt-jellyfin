events {
    worker_connections 1024;
}

http {
    # Shared proxy headers macro
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name agnos.local 192.168.0.8 _;

        # ── Gyra ── agnos.local/gyra ────────────────────────────────────────
        location /gyra/ {
            proxy_pass         http://host.docker.internal:5050/;
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Prefix  /gyra;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
        location = /gyra { return 301 /gyra/; }

        # ── Jellyfin ── agnos.local/tv  (jellyfin redirects to /tv) ───────────
        location /jellyfin/ { return 301 /tv/; }
        location = /jellyfin { return 301 /tv/; }

        location /tv/ {
            proxy_pass         http://host.docker.internal:8096/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /tv;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_read_timeout 600s;
        }
        location = /tv { return 301 /tv/; }

        # ── Audiobookshelf ── agnos.local/books ────────────────────────────
        # proxy_pass has NO trailing slash — full /books/... path passed to ABS
        # ABS must be started with ROUTER_BASE_PATH=/books
        location /books {
            proxy_pass         http://host.docker.internal:13378;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
        location = /books { return 301 /books/; }

        # ── Drive ── agnos.local/drive (Nextcloud) ────────────────────────────
        # Nextcloud must have OVERWRITEWEBROOT=/drive in its docker-compose
        location /drive/ {
            proxy_pass              http://host.docker.internal:7990/;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Forwarded-Host  $host;
            proxy_http_version      1.1;
            proxy_request_buffering off;
            client_max_body_size    10G;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }
        location = /drive { return 301 /drive/; }

        # ── Office ── agnos.local/office ───────────────────────────────────
        location /office/ {
            proxy_pass         http://host.docker.internal:7991/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
        location = /office { return 301 /office/; }

        # ── Vault ── agnos.local/vault ─────────────────────────────────────
        location /vault/ {
            proxy_pass         http://host.docker.internal:7992/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
        location = /vault { return 301 /vault/; }

        # ── Report ── agnos.local/report ───────────────────────────────────
        location /report/ {
            proxy_pass         http://host.docker.internal:8765/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /report { return 301 /report/; }

        # ── Request ── agnos.local/request ─────────────────────────────────
        location /request/ {
            proxy_pass         http://host.docker.internal:8770/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /request { return 301 /request/; }

        # ── Photos ── agnos.local/photos ───────────────────────────────────
        location /photos/ {
            proxy_pass         http://host.docker.internal:2283/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }
        location = /photos { return 301 /photos/; }
    }
}
