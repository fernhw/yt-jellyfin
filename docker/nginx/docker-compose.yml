name: nginx-local

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-local
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:80"   # cloudflared uses this (127.0.0.1:80 has Docker port-table corruption)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Allows the container to reach services on the Mac Mini host
      - "host.docker.internal:host-gateway"
