<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Status">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=2">
  <title>Status — fernhw</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({ appId: "e16639f2-cd69-4411-8548-ee21f3efd73d" });
    });
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#101317;--panel:#171c21;--line:#2a323b;--text:#ecf2f8;--muted:#97a6b4;--warn:#f07f64;--warn-soft:#2b1916;--ok:#4ade80;--chrome-tint:rgba(10,13,16,.86);--chrome-line:rgba(255,255,255,.06)}
    html{background:#05070a;min-height:100%}
    body{background:linear-gradient(180deg,#05070a 0,#0b0e11 100px,var(--bg) 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:max(calc(env(safe-area-inset-top) + 16px),64px) 0 calc(env(safe-area-inset-bottom)+32px);overflow-x:hidden}
    /* gate */
    #gate{display:none;position:fixed;inset:0;background:#0c0f13;z-index:999;justify-content:center;align-items:center;flex-direction:column;gap:16px}
    #gate h2{color:#fff;font-size:1.2rem;font-weight:500}
    #gate input{background:#151a1f;border:1px solid #303844;color:#fff;padding:10px 16px;border-radius:8px;font-size:1rem;width:220px;text-align:center;outline:none}
    #gate input:focus{border-color:#59687a}
    #gate button{background:#1a2026;border:1px solid #36404c;color:#d0dae3;padding:8px 24px;border-radius:8px;cursor:pointer;font-size:.9rem}
    #gate .err{color:#f07f64;font-size:.85rem;min-height:1.2em}
    #app{display:none}
    /* layout */
    .shell{max-width:900px;margin:0 auto;padding:0 12px}
    header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;margin-bottom:14px;background:var(--chrome-tint);border:1px solid var(--chrome-line);border-radius:18px;backdrop-filter:blur(10px);flex-wrap:wrap}
    .hdr-left{display:flex;flex-direction:column;gap:1px}
    .kicker{font:600 .6rem/1.2 sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#c2a365}
    header h1{font-size:.95rem;color:#d8e1ea;font-weight:600}
    .hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .meta-ts{font:500 .72rem/1 sans-serif;color:var(--muted)}
    .notify-btn{background:transparent;border:1px solid #3b4550;color:#c6d0da;padding:5px 11px;border-radius:999px;cursor:pointer;font:600 .65rem/1 sans-serif;letter-spacing:.06em;text-transform:uppercase}
    .sec{margin-bottom:16px}
    .sec-label{font:600 .62rem/1 sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#92a0af;margin-bottom:8px}
    /* divider */
    .divider{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
    .div-label{font:600 .58rem/1 sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#3d4f60;flex-shrink:0}
    .div-line{flex:1;height:1px;background:#1e2830}
    /* service cards */
    .svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
    .svc-card{display:flex;align-items:flex-start;gap:8px;padding:8px 11px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
    .svc-card.down{border-color:rgba(240,127,100,.4);background:var(--warn-soft)}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
    .ok .dot,.dot.ok{background:var(--ok);box-shadow:0 0 5px #4ade8066}
    .down .dot,.dot.down{background:var(--warn);box-shadow:0 0 5px #f07f6466}
    .svc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .svc-name{font-size:.82rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .svc-url{font:400 .63rem/1 sans-serif;color:#3d5468;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
    .svc-url:hover{color:#7999b5}
    .svc-ms{font:500 .67rem/1 sans-serif;color:var(--muted);flex-shrink:0;margin-top:2px}
    .svc-badge{font:600 .56rem/1 sans-serif;padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.05);color:#627384;flex-shrink:0;margin-top:2px}
    /* vitals */
    .vitals{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
    .v-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
    .v-label{font:600 .56rem/1 sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#4a5c6e;margin-bottom:3px}
    .v-val{font:600 1rem/1.2 sans-serif;color:var(--text)}
    .v-sub{font:400 .67rem/1.3 sans-serif;color:var(--muted);margin-top:2px}
    .v-card.warn{border-color:rgba(240,127,100,.4);background:var(--warn-soft)}
    /* spark rows */
    .spark-list{display:flex;flex-direction:column;gap:5px}
    .spark-row{display:flex;align-items:center;gap:9px;padding:6px 11px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
    /* shared: left meta = 38.2%, graph = flex:1 — both rows align */
    .row-meta{flex:0 0 38.2%;min-width:0;display:flex;align-items:center;gap:9px;overflow:hidden}
    .spark-name{flex:1;min-width:0;font:500 .78rem/1 sans-serif;display:flex;flex-direction:column;gap:2px}
    .spark-val{flex-shrink:0;font:500 .7rem/1 sans-serif;color:var(--muted);text-align:right}
    .spark-sub{font:.6rem/1.2 sans-serif;color:var(--muted);opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .spark-svg{flex:1;min-width:0}
    .spark-svg svg{display:block;width:100%;height:28px}
    /* perf */
    .perf-list{display:flex;flex-direction:column;gap:5px}
    .perf-row{display:flex;align-items:center;gap:9px;padding:6px 11px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
    .perf-name{flex:1;min-width:0;font-size:.78rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .perf-badge{flex-shrink:0;font:600 .54rem/1 sans-serif;padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.05);color:#627384;text-align:center}
    .perf-ms{flex-shrink:0;font:500 .68rem/1 sans-serif;color:var(--muted);text-align:right}
    .perf-spark{flex:1;min-width:0;overflow:hidden}
    .perf-spark svg{display:block;width:100%;height:26px}
    /* disk bars */
    .disk-list{display:flex;flex-direction:column;gap:5px}
    .disk-row{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px}
    .disk-top{display:flex;justify-content:space-between;font:500 .76rem/1 sans-serif;margin-bottom:5px}
    .disk-bg{background:#1e2830;border-radius:3px;height:5px;overflow:hidden}
    .disk-fg{height:5px;border-radius:3px}
    .disk-info{font:400 .65rem/1.3 sans-serif;color:var(--muted);margin-top:3px}
    /* log */
    .log-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow-y:auto}
    .log-item{font:400 .7rem/1.5 'SF Mono',Menlo,Consolas,monospace;padding:2px 11px;border-bottom:1px solid rgba(255,255,255,.03);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .log-item:last-child{border-bottom:none}
    .log-item.log-down{color:#f4b9a5}
    .refresh-ind{font:400 .63rem/1 sans-serif;color:#2d3b46;text-align:right;margin-top:6px}
    /* mobile tweaks */
    @media(max-width:480px){
      .spark-val{display:none}
      .perf-badge{display:none}
      .perf-ms{display:none}
    }
    /* cross-highlight + toggle */
    .col-hi{transition:opacity .06s;pointer-events:none}
    .spark-toggle-btn{background:transparent;border:1px solid #3b4550;color:#7899b5;padding:3px 9px;border-radius:999px;cursor:pointer;font:600 .6rem/1 sans-serif;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;margin-left:6px}
    .spark-toggle-btn:hover{border-color:#5a7080;color:#a0c0d8}
    /* tooltip */
    #tip{position:fixed;z-index:9999;pointer-events:none;background:#141b22;border:1px solid #2a3d4d;border-radius:10px;padding:9px 13px;font:400 .72rem/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#d0dae3;max-width:280px;min-width:170px;box-shadow:0 6px 28px rgba(0,0,0,.7);display:none}
    .tip-time{font:.62rem/1 sans-serif;color:#4d6a7e;margin-bottom:5px;letter-spacing:.04em}
    .tip-row{display:flex;justify-content:space-between;gap:18px;line-height:1.65}
    .tip-label{color:#607a8c;white-space:nowrap}
    .tip-val{color:#e0eaf4;font-weight:500;text-align:right;white-space:nowrap}
    .tip-sep{height:1px;background:#1d2c38;margin:5px 0}
  </style>
</head>
<body>

<div id="gate">
  <h2>Status</h2>
  <input type="password" id="pw" placeholder="password" autocomplete="current-password">
  <button onclick="tryAuth()">Enter</button>
  <p class="err" id="err"></p>
</div>
<div id="tip"></div>

<div id="app">
  <div class="shell">

    <header>
      <div class="hdr-left"><div class="kicker">fernhw</div><h1>Status</h1></div>
      <div class="hdr-right">
        <span id="check-ts" class="meta-ts"></span>
        <button class="notify-btn" id="notif-btn" onclick="setupNotify()">Notify</button>
      </div>
    </header>

    <!-- services -->
    <div class="sec">
      <div class="sec-label" id="svc-label">Services</div>
      <div class="svc-grid" id="svc-grid"></div>
    </div>

    <!-- system vitals -->
    <div class="sec">
      <div class="sec-label" id="sys-label">System</div>
      <div class="vitals" id="vitals"></div>
    </div>

    <!-- system sparklines -->
    <div class="sec" id="sec-sparks" style="display:none">
      <div class="sec-label" style="display:flex;justify-content:space-between;align-items:center"><span id="sparks-label">System History</span><button class="spark-toggle-btn" id="win-toggle" onclick="toggleWin()">1hr</button></div>
      <div class="spark-list" id="spark-list"></div>
    </div>

    <!-- response time -->
    <div class="sec">
      <div class="sec-label"><span id="perf-label">Response Time — 24h</span></div>
      <div class="perf-list" id="perf-list"></div>
    </div>

    <!-- disk space -->
    <div class="sec" id="sec-disks" style="display:none">
      <div class="sec-label">Disk Space</div>
      <div class="disk-list" id="disk-list"></div>
    </div>

    <!-- log -->
    <div class="sec">
      <div class="sec-label">Log <span id="log-count" style="font-weight:400;letter-spacing:0;text-transform:none;color:#3d4f60;font-size:.68rem"></span></div>
      <div class="log-box" id="log-box"></div>
    </div>

    <div class="refresh-ind" id="refresh-ind"></div>
  </div>
</div>

<script src="status.js"></script>
<script src="perf.js"></script>
<script src="metrics.js"></script>
<script>
const PW_HASH = "5e7601a1ac99c87a65120283ae1b380901ca55bb402dce34e1a4ec51c20d29bb";
const COOKIE  = "sauth";
const TIP_STORE={}; let _tid=0;
window.SPARK_WIN=60;
window.PERF_WIN=60;

async function sha256hex(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function getCookie(n) {
  return document.cookie.split(";").map(c=>c.trim()).find(c=>c.startsWith(n+"="))?.slice(n.length+1)||"";
}
function setCookie(n,v,d) {
  document.cookie=n+"="+v+";expires="+new Date(Date.now()+d*864e5).toUTCString()+";path=/;SameSite=Strict";
}
async function tryAuth(auto) {
  const inp = auto||document.getElementById("pw").value;
  const h   = await sha256hex(inp);
  if (h===PW_HASH){setCookie(COOKIE,h.slice(0,16),365);showApp();}
  else if (!auto) document.getElementById("err").textContent="wrong password";
}
function showApp() {
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  render();
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryAuth();});

const SERVICE_URLS = {
  gyra:           "http://agnos.local/gyra/",
  jellyfin:       "http://agnos.local/tv/",
  audiobookshelf: "http://agnos.local/audiobookshelf/",
  nextcloud:      "http://agnos.local/drive/",
  onlyoffice:     "https://office.fernhw.com/",
  vaultwarden:    "https://vault.fernhw.com/",
  report:         "http://agnos.local/report/",
  request:        "http://agnos.local/request/",
};
const PUBLIC_SVCS = new Set(["onlyoffice","vaultwarden","cloudflared"]);
const INFRA_SVCS  = new Set(["nginx-local","cloudflared"]);

(async()=>{
  const stored=getCookie(COOKIE);
  if(stored&&stored===PW_HASH.slice(0,16)){showApp();return;}
  const url=new URL(location.href);
  const p=url.searchParams.get("p")||url.searchParams.get("password");
  if(p){
    url.searchParams.delete("p");url.searchParams.delete("password");
    history.replaceState({},"",url.toString());
    await tryAuth(p);
    if(getCookie(COOKIE))return;
  }
  document.getElementById("gate").style.display="flex";
})();

async function setupNotify() {
  if(!window.OneSignal){alert("OneSignal not loaded");return;}
  const ok=await window.OneSignal.Notifications.requestPermission();
  document.getElementById("notif-btn").textContent=ok?"Notifs on":"Blocked";
}

/* helpers */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtTs(iso){
  if(!iso)return"—";
  const d=new Date(iso);
  return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+", "+d.toLocaleDateString([],{month:"short",day:"numeric"});
}
function fmtBytes(b){
  if(b<1024)return b.toFixed(0)+" B";
  if(b<1048576)return(b/1024).toFixed(1)+" KB";
  if(b<1073741824)return(b/1048576).toFixed(1)+" MB";
  return(b/1073741824).toFixed(1)+" GB";
}
function fmtUptime(s){
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);
  if(d>0)return d+"d "+h+"h";
  if(h>0)return h+"h "+m+"m";
  return m+"m";
}

/* tooltip store — reset each render(), keyed per rect via data-tid attribute */

function storeTip(h){const id=++_tid;TIP_STORE[id]=h;return id;}
function tipRow(label,val,col){return`<div class="tip-row"><span class="tip-label">${label}</span><span class="tip-val"${col?` style="color:${col}"`:''}>${val}</span></div>`;}

/* sparkline for perf (ms-based) — per-service scale so spikes are visible */
function perfSpark(vals,sharedMax,tips){
  const W=120,H=26,n=vals.length;if(!n)return"";
  const maxMs=sharedMax||Math.max(...vals.map(v=>v.ms),1);
  const W2=240;
  const bw=W2/n;
  const bars=vals.map((v,i)=>{
    const ta=tips&&tips[i]!=null?` data-tid="${storeTip(tips[i])}"`:""; 
    const bi=` data-bar="${i}"`;
    if(v.ok===null){
      return`<rect x="${(i*bw).toFixed(1)}" y="${H-3}" width="${Math.max(1,bw-.5).toFixed(1)}" height="3" fill="#2a3040" rx="1"${ta}${bi}/>`;
    }
    const pct=v.ok&&v.ms>0?v.ms/maxMs:(v.ok?0.02:1);
    const h=Math.max(2,Math.round(pct*(H-2)));
    return`<rect x="${(i*bw).toFixed(1)}" y="${H-h}" width="${Math.max(1,bw-.5).toFixed(1)}" height="${h}" fill="${v.ok?"#4ade80":"#f07f64"}" rx="1"${ta}${bi}/>`;
  }).join("");
  const hiRects=vals.map((_,i)=>`<rect class="col-hi" data-bar="${i}" x="${(i*bw).toFixed(1)}" y="0" width="${Math.max(1,bw-.5).toFixed(1)}" height="${H}" fill="rgba(255,255,255,.13)" opacity="0" rx="1"/>`).join("");
  return`<svg viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${bars}${hiRects}</svg>`;
}

/* sparkline for metrics (numeric values) — null = gap slot → dim stub */
function metricSpark(vals,fixedMax,color,tips,warnThresh){
  const W=200,H=28,n=vals.length;if(!n)return"";
  const realVals=vals.filter(v=>v!==null&&v!==undefined);
  const max=fixedMax||Math.max(...realVals,1);
  const W2=240;
  const bw=W2/n;
  const bars=vals.map((v,i)=>{
    const ta=tips&&tips[i]!=null?` data-tid="${storeTip(tips[i])}"`:""; 
    const bi=` data-bar="${i}"`;
    if(v===null||v===undefined){
      return`<rect x="${(i*bw).toFixed(1)}" y="${H-3}" width="${Math.max(1,bw-.5).toFixed(1)}" height="3" fill="#2a3040" rx="1"${ta}${bi}/>`;
    }
    const isWarn=warnThresh!=null&&v>=warnThresh;
    const h=Math.max(2,Math.round((v/max)*(H-2)));
    return`<rect x="${(i*bw).toFixed(1)}" y="${H-h}" width="${Math.max(1,bw-.5).toFixed(1)}" height="${h}" fill="${isWarn?"#f07f64":color}" rx="1"${ta}${bi}/>`;
  }).join("");
  const hiRects=vals.map((_,i)=>`<rect class="col-hi" data-bar="${i}" x="${(i*bw).toFixed(1)}" y="0" width="${Math.max(1,bw-.5).toFixed(1)}" height="${H}" fill="rgba(255,255,255,.13)" opacity="0" rx="1"/>`).join("");
  return`<svg viewBox="0 0 ${W2} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${bars}${hiRects}</svg>`;
}

/* render all */
function toggleWin(){window.SPARK_WIN=window.SPARK_WIN===60?15:60;window.PERF_WIN=window.SPARK_WIN;renderMetrics();renderPerf();}
function toggleSparkWin(){toggleWin();}  // legacy alias
function togglePerfWin(){toggleWin();}   // legacy alias
function render(){
  Object.keys(TIP_STORE).forEach(k=>delete TIP_STORE[k]);_tid=0;
  renderStatus();renderMetrics();renderPerf();
}

/* services + log */
function renderStatus(){
  const S=window.STATUS;
  document.getElementById("check-ts").textContent=S?.ts?fmtTs(S.ts):"no data";
  const svcs=S?.services||[];
  const down=svcs.filter(s=>!s.ok).length;
  const lbl=document.getElementById("svc-label");
  lbl.innerHTML=svcs.length
    ?`Services &nbsp;<span style="font-weight:400;letter-spacing:0;text-transform:none;font-size:.68rem;color:${down?"#f07f64":"#4ade80"}">${down?down+" down":"all OK"}</span>`
    :"Services";
  const grid=document.getElementById("svc-grid");
  if(!svcs.length){
    grid.innerHTML='<div style="color:var(--muted);font-size:.82rem;padding:6px 2px">No data yet.</div>';
  } else {
    const local=svcs.filter(s=>!PUBLIC_SVCS.has(s.name)&&!INFRA_SVCS.has(s.name));
    const pub  =svcs.filter(s=> PUBLIC_SVCS.has(s.name)&&!INFRA_SVCS.has(s.name));
    const infra=svcs.filter(s=> INFRA_SVCS.has(s.name));
    function card(s){
      const url=SERVICE_URLS[s.name];
      const urlEl=url?`<a class="svc-url" href="${url}" target="_blank">${url.replace(/^https?:\/\//,"")}</a>`:"";
      return`<div class="svc-card ${s.ok?"ok":"down"}"><span class="dot"></span><div class="svc-info"><span class="svc-name">${esc(s.name)}</span>${urlEl}</div><span class="svc-ms">${s.ms||0}ms</span><span class="svc-badge">${esc(s.code)}</span></div>`;
    }
    function grp(label){return`<div class="divider" style="grid-column:1/-1"><span class="div-label">${label}</span><span class="div-line"></span></div>`;}
    const parts=[];
    if(local.length){parts.push(grp("Local — agnos.local"));parts.push(...local.map(card));}
    if(pub.length)  {parts.push(grp("Public"));parts.push(...pub.map(card));}
    if(infra.length){parts.push(grp("Infrastructure"));parts.push(...infra.map(card));}
    grid.innerHTML=parts.join("");
  }
  const log=(S?.log||[]).slice(0,512);
  document.getElementById("log-count").textContent=`(${log.length})`;
  document.getElementById("log-box").innerHTML=log.length
    ?log.map(e=>`<div class="log-item ${e.msg?.includes("DOWN")?"log-down":""}"><span style="color:#2d3b46">[${fmtTs(e.ts)}]</span> ${esc(e.msg||"")}</div>`).join("")
    :'<div class="log-item">No log entries yet.</div>';
}

/* system vitals + sparklines + disk */
function renderMetrics(){
  const H=window.METRICS_HIST;
  const sysLbl=document.getElementById("sys-label");
  if(!H?.length){
    sysLbl.textContent="System";
    document.getElementById("vitals").innerHTML='<div style="color:var(--muted);font-size:.82rem;padding:6px 2px">No data yet — metricsCheck.py populates every 5 min.</div>';
    return;
  }
  const now=H[0];
  const n=H.length;
  const hrs=(n*5/60).toFixed(1);
  sysLbl.innerHTML=`System &nbsp;<span style="font-weight:400;letter-spacing:0;text-transform:none;font-size:.68rem;color:var(--muted)">${fmtTs(now.ts)}</span>`;

  function vCard(label,val,sub,warn){
    return`<div class="v-card${warn?" warn":""}"><div class="v-label">${label}</div><div class="v-val">${val}</div>${sub?`<div class="v-sub">${sub}</div>`:""}</div>`;
  }
  {const parts=[
    vCard("CPU",     now.cpu+"%",                          "load "+now.load1,                             now.cpu>85),
    vCard("RAM",     (now.mem_used||0).toFixed(1)+" GB",   now.mem_pct+"% of "+now.mem_tot+" GB",          now.mem_pct>90),
    vCard("Swap",    (now.swap_used||0).toFixed(1)+" GB",  now.swap_pct+"% of "+now.swap_tot+" GB",        now.swap_pct>80),
    vCard("VPN",     now.vpn?"ON":"OFF",now.vpn?(now.vpn_ip+" ("+now.vpn_if+")"):"Ecuador / local",false),
    vCard("Uptime",  fmtUptime(now.uptime),now.procs+" proc",                            false),
  ];
  const dios=now.disk_io&&now.disk_io.length?now.disk_io:null;
  if(dios)dios.forEach(d=>{
    const maxBps=(d.mr||0)+(d.mw||0);
    const maxStr=maxBps?(" · max "+fmtBytes(maxBps)+"/s"):"";
    parts.push(vCard(d.l||d.n,fmtBytes(d.r+d.w)+"/s","↑"+fmtBytes(d.r)+" ↓"+fmtBytes(d.w)+"/s"+maxStr,false));
  });
  else parts.push(vCard("Disk I/O",fmtBytes(now.disk_r+now.disk_w)+"/s","R "+fmtBytes(now.disk_r)+" W "+fmtBytes(now.disk_w)+"/s",false));
  parts.push(vCard("Network",fmtBytes(now.net_in+now.net_out)+"/s","&#8595; "+fmtBytes(now.net_in)+" &#8593; "+fmtBytes(now.net_out)+"/s",false));
  document.getElementById("vitals").innerHTML=parts.join("");}

  /* sparklines — 96 bars × 15-min windows (24h), each bar = avg of up to 3 × 5-min snapshots */
  const BEAT_MS=5*60*1000;
  const WIN_MS=window.SPARK_WIN*60*1000;
  const NBARS=Math.round(24*60/window.SPARK_WIN);
  const nowBeat=Math.floor(Date.now()/BEAT_MS)*BEAT_MS;
  // bucket all entries by their 5-min floor
  const byBeat={};
  for(const h of H){
    const hts=new Date(h.ts).getTime();
    const beat=Math.floor(hts/BEAT_MS)*BEAT_MS;
    if(!byBeat[beat]||hts>new Date(byBeat[beat].ts).getTime())byBeat[beat]=h;
  }
  // Build 96 averaged 15-min windows; window 0 = most recent, window 95 = 24h ago
  // Each window covers [winStart, winStart+15min) → 3 × 5-min beats
  const nowWin=Math.floor(Date.now()/WIN_MS)*WIN_MS;
  // avgWin returns an object with averaged numeric fields, or null if no beats present
  function avgWin(winStart){
    const nBeats=WIN_MS/BEAT_MS;
    const beats=Array.from({length:nBeats},(_,j)=>byBeat[winStart+j*BEAT_MS]).filter(Boolean);
    if(!beats.length)return null;
    const avg=k=>beats.reduce((s,b)=>s+(b[k]||0),0)/beats.length;
    // disk_io: average per disk by name
    const diskNames=[...new Set(beats.flatMap(b=>(b.disk_io||[]).map(d=>d.n)))];
    const disk_io=diskNames.map(n=>{
      const ds=beats.map(b=>(b.disk_io||[]).find(d=>d.n===n)).filter(Boolean);
      if(!ds.length)return null;
      const davg=k=>ds.reduce((s,d)=>s+(d[k]||0),0)/ds.length;
      return{n,l:ds[0].l,r:davg("r"),w:davg("w"),ri:davg("ri"),wi:davg("wi"),
             mr:ds[0].mr,mw:ds[0].mw,mir:ds[0].mir,miw:ds[0].miw};
    }).filter(Boolean);
    return{ts:beats[0].ts,cpu:avg("cpu"),mem_pct:avg("mem_pct"),mem_used:avg("mem_used"),
           swap_pct:avg("swap_pct"),swap_used:avg("swap_used"),
           net_in:avg("net_in"),net_out:avg("net_out"),disk_io};
  }
  const slotsN=Array.from({length:NBARS},(_,i)=>avgWin(nowWin-i*WIN_MS));
  const pts=slotsN.slice().reverse();
  // per-bar tooltip HTML indexed same as pts (oldest=0, newest=NBARS-1)
  function makeTip(winStart,pt){
    const d0=new Date(winStart),d1=new Date(winStart+WIN_MS);
    const t0=d0.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const t1=d1.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const ds=d0.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
    let h=`<div class="tip-time">${t0}–${t1} · ${ds}</div>`;
    if(!pt){h+=`<div style="color:#3d4f60;margin-top:4px;font-size:.68rem">No data</div>`;return h;}
    h+=`<div class="tip-sep"></div>`;
    h+=tipRow("CPU",pt.cpu.toFixed(1)+"%",pt.cpu>85?"#f07f64":null);
    h+=tipRow("RAM",(pt.mem_pct||0).toFixed(1)+"% · "+((pt.mem_used||0)).toFixed(1)+" GB",pt.mem_pct>90?"#f07f64":null);
    if(pt.swap_pct!=null)h+=tipRow("Swap",(pt.swap_pct||0).toFixed(1)+"% · "+((pt.swap_used||0)).toFixed(1)+" GB",pt.swap_pct>80?"#f07f64":null);
    h+=tipRow("Net ↓",fmtBytes(pt.net_in)+"/s");
    h+=tipRow("Net ↑",fmtBytes(pt.net_out)+"/s");
    if(pt.disk_io&&pt.disk_io.length){
      h+=`<div class="tip-sep"></div>`;
      pt.disk_io.forEach(d=>{
        h+=tipRow(esc(d.l||d.n)+" R+W",fmtBytes(d.r+d.w)+"/s");
        h+=`<div class="tip-row" style="font-size:.65rem"><span class="tip-label" style="padding-left:6px">↑ read</span><span class="tip-val">${fmtBytes(d.r)}/s · ${(d.ri||0).toLocaleString()} iops</span></div>`;
        h+=`<div class="tip-row" style="font-size:.65rem"><span class="tip-label" style="padding-left:6px">↓ write</span><span class="tip-val">${fmtBytes(d.w)}/s · ${(d.wi||0).toLocaleString()} iops</span></div>`;
      });
    }
    return h;
  }
  const winTips=Array.from({length:NBARS},(_,i)=>makeTip(nowWin-(NBARS-1-i)*WIN_MS,pts[i]));
  const filledCount=slotsN.filter(Boolean).length;
  document.getElementById("sparks-label").textContent=`System History — 24h (${filledCount}/${NBARS} × ${window.SPARK_WIN===15?"15-min":"1-hr"} bars)`;
  const togBtn=document.getElementById("win-toggle");if(togBtn)togBtn.textContent=window.SPARK_WIN===60?"1hr":"15m";
  document.getElementById("sec-sparks").style.display="";
  function sRow(label,vals,fixedMax,color,cur,sub,tips,warnThresh){
    const subHtml=sub?`<span class="spark-sub">${sub}</span>`:"";
    return`<div class="spark-row"><span class="row-meta"><span class="spark-name"><span>${label}</span>${subHtml}</span><span class="spark-val">${cur}</span></span><span class="spark-svg">${metricSpark(vals,fixedMax,color,tips,warnThresh)}</span></div>`;
  }
  const diskColors=["#60a5fa","#a78bfa","#f472b6","#fb923c","#34d399"];
  const diskNames=[...new Set(pts.flatMap(p=>p?(p.disk_io||[]).map(d=>d.n):[]))];
  const diskRows=diskNames.flatMap((name,i)=>{
    const cur=(now.disk_io||[]).find(d=>d.n===name);
    const lbl=cur&&cur.l?cur.l:name;
    const col=diskColors[i%diskColors.length];
    // MB/s row
    const bwVals=pts.map(p=>{if(!p)return null;const d=(p.disk_io||[]).find(x=>x.n===name);return d?d.r+d.w:null;});
    const maxBps=cur?((cur.mr||0)+(cur.mw||0)):0;
    const bwSub=maxBps?"max "+fmtBytes(maxBps)+"/s":null;
    const bwRow=sRow(lbl,bwVals,maxBps||null,col,cur?fmtBytes(cur.r+cur.w)+"/s":"—",bwSub,winTips);
    // IOPS row — dimmer tint of same colour
    const iopsVals=pts.map(p=>{if(!p)return null;const d=(p.disk_io||[]).find(x=>x.n===name);return d?(d.ri||0)+(d.wi||0):null;});
    const maxIops=cur?((cur.mir||0)+(cur.miw||0)):0;
    const curIops=cur?(cur.ri||0)+(cur.wi||0):0;
    const iopsSub=maxIops?"max "+maxIops.toLocaleString()+" IOPS":null;
    const iopsRow=sRow(lbl+" IOPS",iopsVals,maxIops||null,col+"99",curIops.toLocaleString()+" IOPS",iopsSub,winTips);
    return[bwRow,iopsRow];
  });
  const validPts=pts.filter(Boolean);
  const peakCpu=validPts.length?Math.max(...validPts.map(p=>p.cpu)):0;
  const peakRam=validPts.length?Math.max(...validPts.map(p=>p.mem_used||0)):0;
  const peakSwap=validPts.length?Math.max(...validPts.map(p=>p.swap_used||0)):0;
  document.getElementById("spark-list").innerHTML=[
    sRow("CPU",    pts.map(p=>p?p.cpu:null),             100,                "#4ade80",(now.cpu||0)+"%",                    "peak "+peakCpu.toFixed(1)+"%",                                                   winTips,85),
    sRow("RAM",    pts.map(p=>p&&p.mem_pct!=null?p.mem_pct:null),   100,            "#fb923c",(now.mem_used||0).toFixed(1)+" GB","/ "+now.mem_tot+" GB  •  peak "+peakRam.toFixed(1)+" GB",                  winTips,90),
    sRow("Swap",   pts.map(p=>p&&p.swap_pct!=null?p.swap_pct:null),  100,            "#a78bfa",(now.swap_used||0).toFixed(1)+" GB","/ "+(now.swap_tot||"?")+ " GB  •  peak "+peakSwap.toFixed(1)+" GB",winTips,80),
    ...diskRows,
    sRow("Network",pts.map(p=>p?p.net_in+p.net_out:null),null,       "#34d399",fmtBytes(now.net_in+now.net_out)+"/s",undefined,                                                                           winTips),
  ].join("");

  /* disk space */
  const disks=now.disks||[];
  if(disks.length){
    document.getElementById("sec-disks").style.display="";
    document.getElementById("disk-list").innerHTML=disks.map(d=>{
      const c=d.pct>85?`hsl(${Math.round(15+(100-d.pct)*.5)},80%,55%)`:"#4ade80";
      return`<div class="disk-row"><div class="disk-top"><span>${esc(d.m)}</span><span style="color:${c}">${d.pct.toFixed(1)}% used</span></div><div class="disk-bg"><div class="disk-fg" style="width:${d.pct.toFixed(1)}%;background:${c}"></div></div><div class="disk-info">${d.used} GB / ${d.tot} GB — ${(d.tot-d.used).toFixed(1)} GB free</div></div>`;
    }).join("");
  }
}

/* perf response times */
function renderPerf(){
  const P=window.PERF;
  const list=document.getElementById("perf-list");
  if(!P?.hours?.length){
    list.innerHTML='<div style="color:var(--muted);font-size:.82rem;padding:6px 2px">No perf data yet.</div>';
    return;
  }

  // 1hr mode: dedupe to hourly slots, 24 bars with gap-nulls for missing hours
  // 15m mode: raw ring-buffer entries, newest-first slice to 96, no empty gaps
  let slots;
  if(window.PERF_WIN===60){
    const hourMs=3600000;
    const nowHour=Math.floor(Date.now()/hourMs)*hourMs;
    const byHour={};
    for(const h of P.hours){
      const hts=new Date(h.ts).getTime();
      const slot=Math.floor(hts/hourMs)*hourMs;
      if(!byHour[slot]||hts>new Date(byHour[slot].ts).getTime()) byHour[slot]=h;
    }
    slots=Array.from({length:24},(_,i)=>byHour[nowHour-i*hourMs]||null);
  } else {
    // 15m mode: 96 positional slots (same logic as 1hr but 15-min windows)
    // entries land in their correct time slot — gaps show as null, not missing bars
    const slotMs=15*60*1000;
    const nowSlot=Math.floor(Date.now()/slotMs)*slotMs;
    const by15={};
    for(const h of P.hours){
      const hts=new Date(h.ts).getTime();
      const slot=Math.floor(hts/slotMs)*slotMs;
      if(!by15[slot]||hts>new Date(by15[slot].ts).getTime()) by15[slot]=h;
    }
    slots=Array.from({length:96},(_,i)=>by15[nowSlot-i*slotMs]||null);
  }

  const perfLbl=document.getElementById("perf-label");
  if(perfLbl)perfLbl.textContent=`Response Time — 24h (${window.PERF_WIN===60?"1-hr":"15-min"} bars)`;

  const names=[...new Set(slots.filter(Boolean).flatMap(s=>Object.keys(s.data)))];
  const localP=names.filter(n=>!n.includes("."));
  const publicP=names.filter(n=>n.includes("."));

  function row(name){
    // valsNewest[0] = most recent; vals (reversed) = oldest first for bar rendering
    const valsNewest=slots.map(s=>s?(s.data[name]||{ms:0,ok:false}):{ms:0,ok:null});
    const vals=[...valsNewest].reverse();
    const realMs=vals.filter(v=>v.ok!==null).map(v=>v.ms);
    const localMax=Math.max(...realMs,1);
    const avgMs=realMs.length?Math.round(realMs.reduce((a,b)=>a+b,0)/realMs.length):0;
    const p95Ms=realMs.length?(()=>{const s=[...realMs].sort((a,b)=>a-b);return s[Math.floor(s.length*.95)]||s[s.length-1];})():0;
    // tips aligned to vals (oldest first)
    const tips=vals.map((v,i)=>{
      const srcIdx=vals.length-1-i; // index into valsNewest
      const ts=slots[srcIdx]?.ts;
      const d0=ts?new Date(ts):null;
      const t0=d0?d0.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):"?";
      const ds=d0?d0.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}):"?";
      let h=`<div class="tip-time">${t0} · ${ds}</div>`;
      if(v.ok===null){h+=`<div style="color:#3d4f60;margin-top:4px;font-size:.68rem">No data</div>`;return h;}
      h+=`<div class="tip-sep"></div>`;
      h+=tipRow("Response",`<b style="font-size:.9rem">${v.ms}ms</b>`,v.ok?"#4ade80":"#f07f64");
      h+=tipRow("Status",v.ok?'✓ OK':'✗ FAIL',v.ok?"#4ade80":"#f07f64");
      h+=`<div class="tip-sep"></div>`;
      h+=tipRow("avg",avgMs+"ms");
      h+=tipRow("p95",p95Ms+"ms");
      h+=tipRow("peak",localMax+"ms");
      if(v.ms>0)h+=tipRow("% of peak",Math.round(v.ms/localMax*100)+"%",v.ms===localMax?"#f07f64":null);
      return h;
    });
    const curVal=valsNewest[0]||{ms:0,ok:false};
    const recent=valsNewest.filter(v=>v.ok!==null).slice(0,3);
    const allOk=recent.length>0&&recent.every(v=>v.ok);
    return`<div class="perf-row"><span class="row-meta"><span class="dot ${allOk?"ok":"down"}" style="flex-shrink:0;margin-top:0"></span><span class="perf-name">${esc(name)}</span><span class="perf-badge">${name.includes(".")? "pub":"local"}</span><span class="perf-ms">${curVal.ms}ms</span></span><span class="perf-spark">${perfSpark(vals,localMax,tips)}</span></div>`;
  }

  function grp(label){return`<div class="divider"><span class="div-label">${label}</span><span class="div-line"></span></div>`;}
  const parts=[];
  if(localP.length) {parts.push(grp("Local — agnos.local"));parts.push(...localP.map(row));}
  if(publicP.length){parts.push(grp("Public — fernhw.com"));parts.push(...publicP.map(row));}
  list.innerHTML=parts.join("");
}

/* tooltip + cross-row highlight (unified data-bar across metrics + perf) */
(()=>{
  const $t=document.getElementById("tip");
  let _bar=null;
  function clearHi(val){if(val===null)return;document.querySelectorAll(`.col-hi[data-bar="${val}"]`).forEach(r=>r.setAttribute("opacity","0"));}
  function setHi(val){if(val===null)return;document.querySelectorAll(`.col-hi[data-bar="${val}"]`).forEach(r=>r.setAttribute("opacity","1"));}
  document.addEventListener("mousemove",e=>{
    const el=e.target instanceof Element?e.target.closest("[data-tid]"):null;
    if(!el){$t.style.display="none";}
    else{
      const html=TIP_STORE[el.getAttribute("data-tid")];
      if(!html){$t.style.display="none";}
      else{
        $t.innerHTML=html;$t.style.display="block";
        const tw=$t.offsetWidth,th=$t.offsetHeight,vw=innerWidth,vh=innerHeight;
        let x=e.clientX+14,y=e.clientY-10;
        if(x+tw>vw-8)x=e.clientX-tw-14;
        if(y+th>vh-8)y=vh-th-8;
        if(y<8)y=8;
        $t.style.left=x+"px";$t.style.top=y+"px";
      }
    }
    const barEl=e.target instanceof Element?e.target.closest("[data-bar]"):null;
    const barIdx=barEl?barEl.getAttribute("data-bar"):null;
    if(barIdx!==_bar){clearHi(_bar);setHi(barIdx);_bar=barIdx;}
  });
  document.addEventListener("mouseleave",()=>{
    $t.style.display="none";
    clearHi(_bar);_bar=null;
  });
})();

/* reload data files periodically */
function reloadScript(id,src,cb){
  const old=document.getElementById(id);if(old)old.remove();
  const s=document.createElement("script");s.id=id;s.src=src+"?t="+Date.now();s.onload=cb;
  document.head.appendChild(s);
}
setInterval(()=>reloadScript("_sd","status.js",()=>{renderStatus();document.getElementById("refresh-ind").textContent="refreshed "+new Date().toLocaleTimeString();}),60000);
setInterval(()=>reloadScript("_md","metrics.js",renderMetrics),5*60*1000);
setInterval(()=>reloadScript("_pd","perf.js",renderPerf),15*60*1000);
</script>
