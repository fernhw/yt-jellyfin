<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>System — fernhw</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#101317;--panel:#171c21;--line:#2a323b;--text:#ecf2f8;--muted:#97a6b4;--warn:#f07f64;--warn-soft:#2b1916;--ok:#4ade80;--chrome-tint:rgba(10,13,16,.86);--chrome-line:rgba(255,255,255,.06)}
    html{background:#05070a;min-height:100%}
    body{background:linear-gradient(180deg,#05070a 0,#0b0e11 100px,var(--bg) 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top)+10px) 0 calc(env(safe-area-inset-bottom)+28px);overflow-x:hidden}
    #gate{display:none;position:fixed;inset:0;background:#0c0f13;z-index:999;justify-content:center;align-items:center;flex-direction:column;gap:16px}
    #gate h2{color:#fff;font-size:1.2rem;font-weight:500}
    #gate input{background:#151a1f;border:1px solid #303844;color:#fff;padding:10px 16px;border-radius:8px;font-size:1rem;width:220px;text-align:center;outline:none}
    #gate input:focus{border-color:#59687a}
    #gate button{background:#1a2026;border:1px solid #36404c;color:#d0dae3;padding:8px 24px;border-radius:8px;cursor:pointer;font-size:.9rem}
    #gate .err{color:#f07f64;font-size:.85rem;min-height:1.2em}
    #app{display:none}
    .shell{max-width:900px;margin:0 auto;padding:0 14px}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;margin-bottom:14px;background:var(--chrome-tint);border:1px solid var(--chrome-line);border-radius:18px;backdrop-filter:blur(10px)}
    .kicker{font:600 .65rem/1.2 sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#c2a365}
    header h1{font-size:1rem;color:#d8e1ea;font-weight:600}
    .meta-ts{font:500 .74rem/1 sans-serif;color:var(--muted)}
    .sec{margin-bottom:18px}
    .sec-label{font:600 .65rem/1 sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#92a0af;margin-bottom:9px}
    /* vitals */
    .vitals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
    .v-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 13px;display:flex;flex-direction:column;gap:3px}
    .v-label{font:600 .58rem/1 sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#4a5c6e}
    .v-val{font:600 1.05rem/1.2 sans-serif;color:var(--text)}
    .v-sub{font:400 .7rem/1.2 sans-serif;color:var(--muted)}
    .v-card.warn{border-color:rgba(240,127,100,.4);background:var(--warn-soft)}
    /* sparklines */
    .spark-list{display:flex;flex-direction:column;gap:5px}
    .spark-row{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
    .spark-name{width:90px;font-size:.81rem;font-weight:500;flex-shrink:0}
    .spark-val{width:72px;font:500 .72rem/1 sans-serif;color:var(--muted);text-align:right;flex-shrink:0}
    .spark-svg{flex:1;min-width:0}
    .spark-svg svg{display:block;width:100%;height:32px}
    /* disk space */
    .disk-list{display:flex;flex-direction:column;gap:5px}
    .disk-row{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px}
    .disk-top{font:500 .78rem/1 sans-serif;margin-bottom:5px;display:flex;justify-content:space-between}
    .disk-bg{background:#1e2830;border-radius:3px;height:6px;overflow:hidden}
    .disk-fg{height:6px;border-radius:3px}
    .disk-info{font:400 .67rem/1.3 sans-serif;color:var(--muted);margin-top:3px}
    /* history table */
    .hist-wrap{overflow-x:auto;border-radius:11px;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;font:400 .74rem/1 sans-serif}
    thead tr{background:#141920}
    th{padding:7px 10px;text-align:right;font:600 .6rem/1 sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#4a5c6e;white-space:nowrap}
    th:first-child{text-align:left}
    td{padding:5px 10px;text-align:right;border-top:1px solid #1a2129;color:var(--muted);white-space:nowrap}
    td:first-child{text-align:left;font-family:'SF Mono',Menlo,Consolas,monospace;color:#59687a;font-size:.68rem}
    tr:hover td{background:#1a2129}
    .refresh-ind{font:400 .65rem/1 sans-serif;color:#2d3b46;text-align:right;margin-top:6px;padding-right:2px}
    @media(max-width:560px){.spark-val{display:none}}
  </style>
</head>
<body>

<div id="gate">
  <h2>System</h2>
  <input type="password" id="pw" placeholder="password" autocomplete="current-password">
  <button onclick="tryAuth()">Enter</button>
  <p class="err" id="err"></p>
</div>

<div id="app">
  <div class="shell">
    <header>
      <div style="display:flex;align-items:center;gap:12px">
        <a href="./" style="color:#627384;font:.6rem/1 sans-serif;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid #2a323b;padding:5px 10px;border-radius:8px">&#8592; Status</a>
        <div><div class="kicker">fernhw</div><h1>System</h1></div>
      </div>
      <span id="last-ts" class="meta-ts"></span>
    </header>

    <div class="sec">
      <div class="sec-label">Now</div>
      <div class="vitals" id="vitals"></div>
    </div>

    <div class="sec">
      <div class="sec-label" id="spark-label">History</div>
      <div class="spark-list" id="spark-list"></div>
    </div>

    <div class="sec">
      <div class="sec-label">Disk Space</div>
      <div class="disk-list" id="disk-list"></div>
    </div>

    <div class="sec">
      <div class="sec-label">Recent snapshots</div>
      <div class="hist-wrap">
        <table>
          <thead><tr>
            <th style="text-align:left">Time</th>
            <th>CPU%</th><th>Mem%</th><th>Swap%</th>
            <th>Disk R</th><th>Disk W</th>
            <th>Net In</th><th>Net Out</th>
          </tr></thead>
          <tbody id="hist-body"></tbody>
        </table>
      </div>
    </div>

    <div class="refresh-ind" id="ref-ind"></div>
  </div>
</div>

<script src="metrics.js"></script>
<script>
const PW_HASH = "5e7601a1ac99c87a65120283ae1b380901ca55bb402dce34e1a4ec51c20d29bb";
const COOKIE  = "sauth";

async function sha256hex(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function getCookie(n) {
  return document.cookie.split(";").map(c=>c.trim()).find(c=>c.startsWith(n+"="))?.slice(n.length+1) || "";
}
function setCookie(n, v, d) {
  document.cookie = n+"="+v+";expires="+new Date(Date.now()+d*864e5).toUTCString()+";path=/;SameSite=Strict";
}
async function tryAuth(auto) {
  const inp = auto || document.getElementById("pw").value;
  const h   = await sha256hex(inp);
  if (h === PW_HASH) { setCookie(COOKIE, h.slice(0,16), 365); showApp(); }
  else if (!auto) document.getElementById("err").textContent = "wrong password";
}
function showApp() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display  = "block";
  render();
}
document.getElementById("pw").addEventListener("keydown", e => { if (e.key==="Enter") tryAuth(); });

const SERVICE_URLS = {};
const PUBLIC_SVCS = new Set();
const INFRA_SVCS  = new Set();

(async () => {
  const stored = getCookie(COOKIE);
  if (stored && stored === PW_HASH.slice(0,16)) { showApp(); return; }
  const url = new URL(location.href);
  const p = url.searchParams.get("p") || url.searchParams.get("password");
  if (p) {
    url.searchParams.delete("p"); url.searchParams.delete("password");
    history.replaceState({}, "", url.toString());
    await tryAuth(p);
    if (getCookie(COOKIE)) return;
  }
  document.getElementById("gate").style.display = "flex";
})();

/* ── helpers ─────────────────────────────────────────────────────────────── */
function fmtTs(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) + ", " + d.toLocaleDateString([],{month:"short",day:"numeric"});
}
function fmtBytes(b) {
  if (b < 1024)       return b.toFixed(0) + " B";
  if (b < 1048576)    return (b/1024).toFixed(1) + " KB";
  if (b < 1073741824) return (b/1048576).toFixed(1) + " MB";
  return (b/1073741824).toFixed(1) + " GB";
}
function fmtUptime(s) {
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60);
  if (d > 0) return d+"d "+h+"h";
  if (h > 0) return h+"h "+m+"m";
  return m+"m";
}
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── sparkline (static SVG bars, same approach as perf sparklines) ───────── */
function sparkline(vals, fixedMax, color) {
  const W=200, H=32, n=vals.length;
  if (!n) return `<svg viewBox="0 0 200 32" xmlns="http://www.w3.org/2000/svg"></svg>`;
  const max = fixedMax || Math.max(...vals, 1);
  const bw  = W / n;
  const bars = vals.map((v, i) => {
    const h = Math.max(2, Math.round((v / max) * (H - 2)));
    return `<rect x="${(i*bw).toFixed(1)}" y="${H-h}" width="${Math.max(1, bw-.5).toFixed(1)}" height="${h}" fill="${color}" rx="1"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}

function vCard(label, val, sub, warn) {
  return `<div class="v-card${warn ? " warn" : ""}">
    <div class="v-label">${esc(label)}</div>
    <div class="v-val">${esc(val)}</div>
    ${sub ? `<div class="v-sub">${esc(sub)}</div>` : ""}
  </div>`;
}
function sRow(label, vals, fixedMax, color, curVal) {
  return `<div class="spark-row">
    <span class="spark-name">${esc(label)}</span>
    <span class="spark-val">${esc(curVal)}</span>
    <span class="spark-svg">${sparkline(vals, fixedMax, color)}</span>
  </div>`;
}

/* ── render ──────────────────────────────────────────────────────────────── */
function render() {
  const H = window.METRICS_HIST;
  if (!H || !H.length) {
    document.getElementById("vitals").innerHTML = '<div style="color:var(--muted);font-size:.84rem;padding:8px 2px">No data yet — metricsCheck.py populates this every 5 min.</div>';
    ["spark-list","disk-list","hist-body"].forEach(id => document.getElementById(id).innerHTML = "");
    document.getElementById("last-ts").textContent = "no data";
    return;
  }

  const now = H[0];
  document.getElementById("last-ts").textContent = fmtTs(now.ts);

  // vitals
  document.getElementById("vitals").innerHTML = [
    vCard("CPU",     now.cpu + "%",      "load " + now.load1,                                now.cpu > 85),
    vCard("Memory",  now.mem_pct + "%",  now.mem_used + " / " + now.mem_tot + " GB",         now.mem_pct > 90),
    vCard("Swap",    now.swap_pct + "%", now.swap_used + " / " + now.swap_tot + " GB",        now.swap_pct > 80),
    vCard("VPN",     now.vpn ? "ON" : "OFF", now.vpn ? ((now.vpn_if||"") + " " + (now.vpn_ip||"")) : "no tunnel", false),
    vCard("Uptime",  fmtUptime(now.uptime), now.procs + " proc",                              false),
    vCard("Disk I/O",fmtBytes(now.disk_r+now.disk_w)+"/s", "R "+fmtBytes(now.disk_r)+" W "+fmtBytes(now.disk_w)+"/s", false),
    vCard("Network", fmtBytes(now.net_in+now.net_out)+"/s", "&#8595; "+fmtBytes(now.net_in)+" &#8593; "+fmtBytes(now.net_out)+"/s", false),
  ].join("");

  // sparklines — up to 48 pts = 4h, reversed so newest bar is on the right
  const pts = H.slice(0, 48).reverse();
  const n   = H.length;
  const hrs = (n * 5 / 60).toFixed(1);
  document.getElementById("spark-label").textContent =
    "History \u2014 " + n + " snapshots \u00b7 5-min intervals \u00b7 ~" + hrs + " h";
  document.getElementById("spark-list").innerHTML = [
    sRow("CPU",      pts.map(p => p.cpu),              100,  "#4ade80", now.cpu + "%"),
    sRow("Memory",   pts.map(p => p.mem_pct),          100,  "#fb923c", now.mem_pct + "%"),
    sRow("Disk I/O", pts.map(p => p.disk_r + p.disk_w), null, "#60a5fa", fmtBytes(now.disk_r+now.disk_w)+"/s"),
    sRow("Network",  pts.map(p => p.net_in + p.net_out), null, "#34d399", fmtBytes(now.net_in+now.net_out)+"/s"),
  ].join("");

  // disk space
  document.getElementById("disk-list").innerHTML = (now.disks || []).map(d => {
    const c = d.pct > 85 ? `hsl(${Math.round(15+(100-d.pct)*0.5)},80%,55%)` : "#4ade80";
    return `<div class="disk-row">
      <div class="disk-top"><span>${esc(d.m)}</span><span style="color:${c}">${d.pct.toFixed(1)}% used</span></div>
      <div class="disk-bg"><div class="disk-fg" style="width:${d.pct.toFixed(1)}%;background:${c}"></div></div>
      <div class="disk-info">${d.used} GB / ${d.tot} GB \u2014 ${(d.tot - d.used).toFixed(1)} GB free</div>
    </div>`;
  }).join("");

  // history table — most recent 12 snapshots
  document.getElementById("hist-body").innerHTML = H.slice(0, 12).map(p =>
    `<tr>
      <td>${fmtTs(p.ts)}</td>
      <td>${p.cpu}%</td><td>${p.mem_pct}%</td><td>${p.swap_pct}%</td>
      <td>${fmtBytes(p.disk_r)}/s</td><td>${fmtBytes(p.disk_w)}/s</td>
      <td>${fmtBytes(p.net_in)}/s</td><td>${fmtBytes(p.net_out)}/s</td>
    </tr>`
  ).join("");
}

/* ── reload metrics.js every 5 min (same pattern as status.js reload) ────── */
function reloadData() {
  const old = document.getElementById("_md");
  if (old) old.remove();
  const s = document.createElement("script");
  s.id  = "_md";
  s.src = "metrics.js?t=" + Date.now();
  s.onload = () => {
    render();
    document.getElementById("ref-ind").textContent = "refreshed " + new Date().toLocaleTimeString();
  };
  document.head.appendChild(s);
}
setInterval(reloadData, 5 * 60 * 1000);
</script>
</body>
</html>
