{% extends "base.html" %}
{% block title %}{{ project.name }} — Archive — Gyra{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <span class="project-key-badge">{{ project.key }}</span>
    <h2>Archive</h2>
  </div>
  <div class="page-header-right">
    <a class="btn btn-sm btn-secondary" href="{{ url_for('board', project_id=project.id) }}">← Board</a>
  </div>
</div>

<div class="archive-layout">
  <div class="archive-list-panel">
    <div id="archive-list"></div>
    <div id="archive-sentinel" style="height:1px"></div>
    <div id="archive-loading" class="archive-loading" style="display:none">Loading…</div>
    <div id="archive-empty"   class="archive-empty"   style="display:none">No archived stories yet.</div>
  </div>
  <div class="archive-preview-panel" id="archive-preview">
    <div class="archive-preview-empty">← tap a story to preview</div>
  </div>
</div>

<script>
(function () {
  var PID    = {{ project.id }};
  var CSRF   = (document.querySelector('meta[name="csrf-token"]') || {content: ''}).content;
  var ROOT   = (document.querySelector('meta[name="app-root"]') || {getAttribute: function(){return '';}}).getAttribute('content') || '';

  var list     = document.getElementById('archive-list');
  var sentinel = document.getElementById('archive-sentinel');
  var loading  = document.getElementById('archive-loading');
  var empty    = document.getElementById('archive-empty');
  var preview  = document.getElementById('archive-preview');

  var page     = 0;
  var fetching = false;
  var done     = false;
  var selected = null; // currently selected row el

  var SICONS = {exclamation:'!',arrow:'→',question:'?',star:'★',fire:'🔥',eyes:'👀',check:'✓',blocked:'✕',up:'↑',note:'#'};

  function _esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Render one post-it card (only called for the selected item) ────────────
  // Markup mirrors templates/board.html exactly so the preview is pixel-identical.
  function renderCard(item) {
    var rot    = (item.id * 7 % 5) - 2;
    var accent = item.story_type_color || '#B45309';
    var cardBg = item.story_type_color
                 ? 'color-mix(in srgb,' + item.story_type_color + ' 22%,white)'
                 : '#FFF9C4';

    var isEpic = item.story_type_name === 'Epic' ? ' is-epic-type' : '';

    // select hit area — same as board, but inert in archive preview
    var selBox = '<label class="card-sel" onclick="event.stopPropagation()" title="Select">'
               + '<input type="checkbox" class="card-sel-cb" disabled>'
               + '<span class="card-sel-mark"></span>'
               + '</label>';

    var tape = item.priority
      ? '<div class="card-tape card-tape-' + item.priority.toLowerCase() + '">' + _esc(item.priority) + '</div>'
      : '';

    var typeBadge = item.story_type_name
      ? '<span class="card-type-badge">' + _esc(item.story_type_name) + '</span>'
      : '';

    var cardId = '<span class="card-id">' + _esc(item.project_key || '') + '-' + (item.story_number != null ? item.story_number : item.id) + '</span>';

    // html_title comes pre-rendered from the server (with <strong> for the verb)
    var titleHtml = item.html_title || _esc(item.title || '');

    var imagesHtml = '';
    if (item.images && item.images.length) {
      imagesHtml = '<div class="card-images">';
      item.images.slice(0, 5).forEach(function(fname) {
        imagesHtml += '<div class="card-image-item">'
                   +  '<img src="' + ROOT + '/story-images/thumb_' + _esc(fname) + '" alt="" loading="lazy">'
                   +  '</div>';
      });
      imagesHtml += '</div>';
    }

    var footHtml = '<div class="card-footer">';
    if (item.story_points) {
      footHtml += '<span class="card-points">' + item.story_points + 'pt</span>';
    }
    if (item.assignees && item.assignees.length) {
      footHtml += '<div class="card-assignees">';
      item.assignees.forEach(function(a) {
        if (a.avatar) {
          footHtml += '<img src="' + ROOT + '/avatars/' + _esc(a.avatar) + '" class="avatar-xs" title="' + _esc(a.display_name) + '" alt="">';
        } else {
          footHtml += '<span class="avatar-initial-xs" title="' + _esc(a.display_name) + '">' + _esc(((a.display_name || '?')[0] || '?').toUpperCase()) + '</span>';
        }
      });
      footHtml += '</div>';
    }
    footHtml += '</div>';

    var skHtml = '';
    if (item.stickers && item.stickers.length) {
      item.stickers.forEach(function(sk) {
        var icon = SICONS[sk.type] || sk.type;
        var cx = sk.card_x != null ? sk.card_x : 50;
        var cy = sk.card_y != null ? sk.card_y : 10;
        skHtml +=
          '<div class="board-sticker sticker-' + _esc(sk.type) + ' sticker-on-card' + (sk.label ? ' has-label' : '') + '"'
          + ' style="left:' + cx + '%;top:' + cy + '%">'
          + '<span class="sticker-icon">' + icon + '</span>'
          + (sk.label ? '<span class="sticker-label">' + _esc(sk.label) + '</span>' : '')
          + '</div>';
      });
    }

    preview.innerHTML =
      '<div class="archive-preview-card">'
      + '<div class="board-card' + isEpic + '"'
      +   ' style="--rot:' + rot + 'deg;--card-bg:' + cardBg + ';--card-accent:' + accent + '"'
      +   ' data-story-id="' + item.id + '">'
      + selBox + tape + typeBadge + cardId
      + '<div class="card-title">' + titleHtml + '</div>'
      + imagesHtml
      + footHtml
      + skHtml
      + '</div>'
      + '<div class="archive-preview-actions">'
      + '<a class="btn btn-sm btn-secondary" href="' + ROOT + '/story/' + ((item.project_key && item.story_number != null) ? (item.project_key + '-' + item.story_number) : item.id) + '">✏ Edit</a>'
      + '<button class="btn btn-sm btn-primary archive-readd-btn" data-id="' + item.id + '">↩ Return to sprint</button>'
      + '</div>'
      + '</div>';

    preview.querySelector('.archive-readd-btn').addEventListener('click', function() {
      reAdd(item.id, this);
    });
  }

  // ── Render a lightweight list row ─────────────────────────────────────────
  function renderRow(item, itemData) {
    var row = document.createElement('div');
    row.className = 'archive-row';
    row.dataset.id = item.id;

    var dot = item.story_type_color
      ? '<span class="archive-row-dot" style="background:' + _esc(item.story_type_color) + '"></span>'
      : '<span class="archive-row-dot"></span>';

    var key = '<span class="archive-row-key">' + _esc(item.project_key || '') + '-' + (item.story_number != null ? item.story_number : item.id) + '</span>';

    var title = '<span class="archive-row-title">' + _esc(item.title) + '</span>';

    var meta = '';
    if (item.story_type_name) meta += '<span class="archive-row-tag">' + _esc(item.story_type_name) + '</span>';
    if (item.sprint)          meta += '<span class="archive-row-tag">Sprint ' + _esc(item.sprint) + '</span>';
    if (item.story_points)    meta += '<span class="archive-row-tag">' + item.story_points + 'pt</span>';

    row.innerHTML = '<div class="archive-row-main">' + dot + key + title + '</div>'
                  + (meta ? '<div class="archive-row-meta">' + meta + '</div>' : '');

    row.addEventListener('click', function() {
      if (selected) selected.classList.remove('is-active');
      selected = row;
      row.classList.add('is-active');
      renderCard(itemData);
    });

    return row;
  }

  function reAdd(storyId, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    fetch(ROOT + '/api/story/' + storyId + '/unarchive', {
      method: 'POST',
      headers: {'X-CSRF-Token': CSRF, 'Content-Type': 'application/x-www-form-urlencoded'},
      body: '_csrf=' + encodeURIComponent(CSRF),
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        // remove list row
        var row = list.querySelector('[data-id="' + storyId + '"]');
        if (row) row.remove();
        // clear preview
        preview.innerHTML = '<div class="archive-preview-empty">← tap a story to preview</div>';
        selected = null;
      } else {
        btn.disabled = false;
        btn.textContent = '↩ Return to sprint';
        alert('Error: ' + (d.error || 'unknown'));
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = '↩ Return to sprint';
    });
  }

  function fetchPage() {
    if (fetching || done) return;
    fetching = true;
    loading.style.display = '';
    fetch(ROOT + '/api/project/' + PID + '/archive?page=' + page + '&per_page=40')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        loading.style.display = 'none';
        fetching = false;
        data.items.forEach(function(item) {
          list.appendChild(renderRow(item, item));
        });
        if (!data.has_more) {
          done = true;
          if (page === 0 && data.items.length === 0) empty.style.display = '';
        }
        page++;
      })
      .catch(function() {
        loading.style.display = 'none';
        fetching = false;
      });
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) fetchPage();
    }, {threshold: 0});
    io.observe(sentinel);
  } else {
    fetchPage();
  }
})();
</script>
{% endblock %}
