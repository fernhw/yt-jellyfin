<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark warm background -->
  <rect width="32" height="32" rx="6" fill="#1A1208"/>
  <!-- Pin needle (angled, dark) -->
  <line x1="17" y1="17" x2="28" y2="28" stroke="#7C4A1E" stroke-width="3" stroke-linecap="round"/>
  <!-- Pushpin head -->
  <circle cx="12" cy="12" r="9" fill="#A0632A"/>
  <!-- Head depth ring -->
  <circle cx="12" cy="12" r="6" fill="#8A5220" opacity="0.45"/>
  <!-- Head glare / highlight -->
  <ellipse cx="9" cy="9" rx="3.5" ry="2.5" fill="#D4A060" opacity="0.65" transform="rotate(-20 9 9)"/>
  <!-- Center pin hole -->
  <circle cx="12" cy="12" r="2" fill="#5C3010" opacity="0.7"/>
</svg>
